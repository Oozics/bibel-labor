name: Selbsttest

on:
  push:
    branches: [main]
    paths: ["quelle/**", "werkzeuge/**", "messungen/ergebnisse.md", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selbsttest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: PDF-Werkzeuge installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          pip install -q -r werkzeuge/requirements.txt
      - name: Selbsttest der Bibel
        run: python werkzeuge/selbsttest.py --pdf
      - name: PDFs bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: bibel-pdfs
          path: ausgabe/*.pdf
