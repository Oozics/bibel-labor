name: Selbsttest

on:
  push:
    branches: [main]
    paths: ["quelle/**", "werkzeuge/**", "messungen/ergebnisse.md", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selbsttest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: PDF-Werkzeuge installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          pip install -q -r werkzeuge/requirements.txt
      - name: Selbsttest der Bibel
        run: python werkzeuge/selbsttest.py --pdf
      - name: PDFs bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bibel-pdfs
          path: ausgabe/*.pdf
