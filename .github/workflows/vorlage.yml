name: Vorlage veröffentlichen

# Brings the template repository to the version in quelle/version.json:
# self-test, generate the template, merge it to main, tag and release it,
# and optionally start the reference run.

on:
  workflow_dispatch:
    inputs:
      referenzlauf_starten:
        description: "Danach den Referenzlauf starten"
        type: boolean
        default: true

concurrency:
  group: vorlage
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Selbsttest der Bibel
        run: python werkzeuge/selbsttest.py

      - name: Version lesen
        id: version
        run: echo "v=$(python -c 'import json;print(json.load(open("quelle/version.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Vorlage erzeugen und veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.BIBEL_GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          V: ${{ steps.version.outputs.v }}
        run: |
          set -euo pipefail
          repo="$OWNER/ki-projekt-vorlage"
          tag="v$V"
          gh auth setup-git
          gh repo clone "$repo" vorlage -- --quiet
          cd vorlage
          git config user.name "Bibel-Labor"
          git config user.email "bibel-labor@users.noreply.github.com"

          # Regenerate everything so that removed files disappear too
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          python ../werkzeuge/vorlage.py .
          git add -A

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then tag_exists=true; fi

          if git diff --cached --quiet; then
            echo "Die Vorlage auf main entspricht bereits Version $V."
          else
            if [ "$tag_exists" = true ]; then
              echo "::error::Tag $tag existiert schon, aber die Vorlage hat sich geändert. Bitte die Version in quelle/version.json erhöhen."
              exit 1
            fi
            branch="release/$tag"
            git checkout -q -B "$branch"
            git commit -q -m "chore: KI-Projekt-Bibel template, version $V"
            git push -q --force-with-lease origin "$branch"
            gh pr create --repo "$repo" --base main --head "$branch" \
              --title "KI-Projekt-Bibel $V" --body "Automatisch erzeugt aus bibel-labor." || true
            gh pr merge "$branch" --repo "$repo" --merge --delete-branch
            echo "Version $V auf main gemergt."
          fi

          if [ "$tag_exists" = false ]; then
            gh release create "$tag" --repo "$repo" --target main \
              --title "KI-Projekt-Bibel $V" --notes "Erzeugt aus bibel-labor, Commit $GITHUB_SHA."
            echo "Release $tag angelegt."
          else
            echo "Release $tag gibt es schon."
          fi

      - name: Referenzlauf starten
        if: inputs.referenzlauf_starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run referenzlauf.yml --repo "$GITHUB_REPOSITORY" --ref main
