name: Referenzlauf

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bibel-Version (leer = aktuelle Version aus quelle/version.json)"
        required: false
        default: ""
      budget_gesamt:
        description: "Kostenbremse für den ganzen Lauf in USD"
        required: false
        default: "10"
      berechtigungen:
        description: "Berechtigungsmodus der Rollen"
        type: choice
        options: [auto, bypassPermissions]
        default: auto

concurrency:
  group: referenzlauf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lauf:
    runs-on: windows-latest
    timeout-minutes: 360
    outputs:
      protokoll: ${{ steps.lauf.outputs.protokoll }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Claude Code installieren
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Werkzeuge prüfen
        run: |
          claude --version
          gh --version
          git --version
          python --version
      - name: Git-Zugang für die Rollen
        env:
          GH_TOKEN: ${{ secrets.BIBEL_GH_TOKEN }}
        run: gh auth setup-git
      - name: Referenzlauf
        id: lauf
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.BIBEL_GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          BUDGET: ${{ inputs.budget_gesamt }}
          MODE: ${{ inputs.berechtigungen }}
          RUN_ID: ${{ github.run_id }}
        run: |
          args=(--owner "$OWNER" --budget-total "$BUDGET" --permission-mode "$MODE" --run-id "$RUN_ID")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          python werkzeuge/referenzlauf.py "${args[@]}"
      - name: Messdaten sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: messung
          path: messungen/

  bericht:
    needs: lauf
    if: always() && needs.lauf.outputs.protokoll != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: messung
          path: messungen/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: PDF-Werkzeuge installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          pip install -q -r werkzeuge/requirements.txt
      - name: Prüfbericht als PDF
        env:
          PROTOKOLL: ${{ needs.lauf.outputs.protokoll }}
        run: python werkzeuge/bericht.py "$PROTOKOLL"
      - name: Ergebnisse speichern
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "Referenzlauf"
          git config user.email "referenzlauf@users.noreply.github.com"
          git add messungen/
          git commit -m "Referenzlauf $RUN_ID: Messdaten und Prüfbericht"
          git push
      - name: Prüfbericht bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pruefbericht
          path: messungen/berichte/*.pdf
