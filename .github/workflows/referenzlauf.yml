name: Referenzlauf

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bibel-Version (leer = aktuelle Version aus quelle/version.json)"
        required: false
        default: ""
      budget_gesamt:
        description: "Kostenbremse für den ganzen Lauf in USD"
        required: false
        default: "20"
      berechtigungen:
        description: "Berechtigungsmodus der Rollen"
        type: choice
        options: [auto, bypassPermissions]
        default: auto

concurrency:
  group: referenzlauf
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  lauf:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Claude Code installieren
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Werkzeuge prüfen
        run: |
          claude --version
          gh --version
          git --version
          python --version
      - name: Git-Zugang für die Rollen
        env:
          GH_TOKEN: ${{ secrets.BIBEL_GH_TOKEN }}
        run: gh auth setup-git
      - name: Referenzlauf
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.BIBEL_GH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          BUDGET: ${{ inputs.budget_gesamt }}
          MODE: ${{ inputs.berechtigungen }}
          RUN_ID: ${{ github.run_id }}
        run: |
          args=(--owner "$OWNER" --budget-total "$BUDGET" --permission-mode "$MODE" --run-id "$RUN_ID")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          python werkzeuge/referenzlauf.py "${args[@]}"
      - name: Messdaten sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: messung
          path: messungen/

  bericht-starten:
    needs: lauf
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bericht-Workflow starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bericht.yml --repo "$GITHUB_REPOSITORY" --ref main -f run_id="$GITHUB_RUN_ID"
